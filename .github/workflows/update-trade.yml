name: Update trade data (manual)

on:
  workflow_dispatch:

jobs:
  update-trade-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Request API to update trade data
        run: |
          curl -X POST https://resonance.drakontia.com/api/trade
